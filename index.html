<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PsicoTEAM v6</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
:root{
  --bg:#f0f4f8;--sidebar:#1a1a2e;--primary:#00a3e0;--green:#2e7d32;
  --red:#E24B4A;--border:#e5e7eb;--text:#1a1a2e;--muted:#6b7280;
}
html,body{min-height:100%;background:var(--bg)}
body{display:flex;align-items:flex-start;justify-content:center}

/* SAVE INDICATOR */
#ind{position:fixed;top:10px;right:14px;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500;z-index:500;transition:opacity .4s;opacity:0}
#ind.show{opacity:1}
#ind.ok{background:#d1fae5;color:#065f46}
#ind.saving{background:#fef9c3;color:#713f12}
#ind.err{background:#fee2e2;color:#991b1b}

/* ALERTAS */
#alerts{position:fixed;top:0;left:0;right:0;z-index:400;pointer-events:none}
.alert-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:12px;pointer-events:all;animation:slideDown .3s ease}
.alert-item.urgente{background:#b71c1c;color:#fff}
.alert-item.aviso{background:#e65100;color:#fff}
.alert-item.ok-alert{background:#1b5e20;color:#fff}
.alert-close{margin-left:auto;background:none;border:none;color:inherit;cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}

/* APP LAYOUT */
.app{display:flex;width:100%;min-height:100vh;background:#fff}
.sidebar{width:210px;flex-shrink:0;background:var(--sidebar);display:flex;flex-direction:column;min-height:100vh;overflow-y:auto;position:sticky;top:0;max-height:100vh}
.logo-area{background:#000;padding:8px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo-area img{width:100%;display:block}
.logo-area .logo-txt{color:#00a3e0;font-weight:700;font-size:16px;padding:10px 12px}
.sec-label{padding:8px 10px 4px;font-size:10px;color:rgba(0,163,224,.8);font-weight:600;letter-spacing:.07em;margin-top:4px}
.nav-btn{background:none;border:none;text-align:left;padding:8px 12px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:7px;width:100%;transition:background .15s}
.nav-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-btn.active{background:rgba(0,163,224,.25);color:#fff;font-weight:500}
.nav-btn .badge{background:#c62828;color:#fff;border-radius:10px;font-size:9px;padding:1px 5px;margin-left:auto;font-weight:700}
.ag-item{display:flex;align-items:center;gap:7px;padding:5px 12px;cursor:pointer;font-size:11px;color:rgba(255,255,255,.75);transition:background .15s}
.ag-item:hover{background:rgba(255,255,255,.08)}
.ag-item.active{background:rgba(255,255,255,.15);color:#fff}
.ag-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.grp-hdr{display:flex;align-items:center;gap:6px;padding:6px 10px 4px;cursor:pointer;font-size:10px;color:rgba(0,163,224,.85);font-weight:700;letter-spacing:.06em;margin-top:6px;border-top:1px solid rgba(255,255,255,.07)}
.grp-hdr:hover{background:rgba(255,255,255,.05)}
.grp-items{overflow:hidden;transition:max-height .25s ease}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#fff;position:sticky;top:0;z-index:10}
.topbar h2{font-size:14px;font-weight:600;color:var(--text)}
.topbar-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.content{flex:1;padding:14px;overflow:auto}

/* BUTTONS */
.btn{padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;border:none;white-space:nowrap;transition:all .15s}
.btn-blue{background:#00a3e0;color:#fff}.btn-blue:hover{background:#0090c5}
.btn-green{background:#2e7d32;color:#fff}.btn-green:hover{background:#1b5e20}
.btn-outline{background:none;border:1px solid #d1d5db;color:var(--muted)}.btn-outline:hover{background:#f5f7fa}
.btn-red{background:#E24B4A;color:#fff}.btn-red:hover{background:#c0392b}
.btn-sm{padding:4px 9px;font-size:11px}

/* LEGENDA */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;align-items:center}
.leg-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}

/* TABLE */
.wrap{}
table{border-collapse:collapse;width:100%;min-width:700px;font-size:11px}
th,td{border:1px solid #ccc;padding:0;text-align:center;vertical-align:middle;height:38px}
th{background:#006fa8;color:#fff;font-weight:500;font-size:11px;padding:5px 3px;position:sticky;top:0;z-index:5}
th.hora-col{width:76px}
td.hora-cell{background:#e0f4fb;color:#005f80;font-weight:500;font-size:11px;width:76px}
td.almoco{background:#00bcd4;color:#003a42;font-weight:500;font-size:11px}
td.reuniao{background:#7b1fa2;color:#fff;font-weight:500;font-size:11px}
td.bloqueado{background:#eee}
td.vazio{background:#fff;cursor:pointer}
td.vazio:hover{background:#f0f7ff}
td.pac-unimed{background:#1b5e20;color:#fff;cursor:pointer;font-size:11px;padding:2px 3px}
td.pac-intercambio{background:#a5d6a7;color:#1b2e1c;cursor:pointer;font-size:11px;padding:2px 3px}
td.pac-particular{background:#1565c0;color:#fff;cursor:pointer;font-size:11px;padding:2px 3px}
td.pac-falta{background:#c62828;color:#fff;cursor:pointer;font-size:11px;padding:2px 3px}
td.pac-unimed:hover,td.pac-intercambio:hover,td.pac-particular:hover,td.pac-falta:hover{filter:brightness(.88)}
td.paciente-cell span.conv{display:block;font-size:9px;opacity:.85}

/* PAT CARDS */
.search-bar{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff;margin-bottom:10px}
.pat-card{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:6px;background:#fff;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.pat-card:hover{border-color:#9ca3af;background:#f9fafb}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.pat-info h4{font-size:12px;font-weight:600;color:var(--text)}
.pat-info p{font-size:11px;color:var(--muted)}
.conv-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:auto;flex-shrink:0}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:20px;width:440px;max-width:100%;max-height:90vh;overflow-y:auto;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal h3{font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text)}
.form-group{margin-bottom:9px}
.form-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;background:#fff;color:var(--text);font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#00a3e0}
.form-group textarea{height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border)}

/* TABS (modal paciente) */
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:12px}
.tab-btn{padding:6px 14px;font-size:12px;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;transition:all .15s}
.tab-btn.active{color:#00a3e0;border-bottom-color:#00a3e0;font-weight:600}
.tab-pane{display:none}.tab-pane.active{display:block}

/* GUIA SUB-TABS */
.gtab-bar{display:flex;flex-wrap:wrap;gap:2px;border-bottom:2px solid var(--border);margin-bottom:12px}
.gtab-bar button{padding:4px 9px;font-size:11px;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:400;transition:all .15s;white-space:nowrap}
.gtab-bar button.gactive{color:#00a3e0;border-bottom-color:#00a3e0;font-weight:600}
.gtab-pane{display:none}.gtab-pane.active{display:block}

/* LAUDO UPLOAD */
.laudo-drop{border:2px dashed #b0bec5;border-radius:8px;padding:16px;text-align:center;cursor:pointer;background:#fafafa;transition:all .2s;margin-top:6px}
.laudo-drop:hover,.laudo-drop.drag{border-color:#00695c;background:#e8f5e9}

/* AGENDA CARD */
.agenda-card{border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;background:#fff}
.ag-color-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}

/* SLOT EDITOR */
.slot-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.slot-label{width:90px;flex-shrink:0;color:var(--muted);font-size:11px}
.slot-toggle{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;font-size:13px;flex-shrink:0;line-height:1}
.slot-toggle.on{background:#d1fae5;color:#065f46}
.slot-toggle.off{background:#fee2e2;color:#991b1b}

/* COLOR SWATCHES */
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s;flex-shrink:0}
.swatch:hover{transform:scale(1.15)}
.swatch.sel{border-color:#fff;outline:2px solid #333}

/* CONFIG */
.cfg-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.cstat{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.cstat .num{font-size:22px;font-weight:700;color:#00695c}
.cstat .lbl{font-size:11px;color:var(--muted);margin-top:2px}
.cfg-tab-bar{display:flex;border-bottom:2px solid var(--border);margin-bottom:14px}
.cfg-tab{padding:7px 16px;font-size:12px;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;transition:all .15s}
.cfg-tab.active{color:#00a3e0;border-bottom-color:#00a3e0;font-weight:600}
.cfg-pane{display:none}.cfg-pane.active{display:block}
.bulk-bar{display:none;align-items:center;gap:10px;background:#1a237e;color:#fff;padding:9px 14px;border-radius:6px;margin-bottom:10px;font-size:12px}
.bulk-bar.show{display:flex}
.bulk-bar>span{flex:1;font-weight:600}
.cfg-tbl{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.cfg-tbl th{background:#004d40;color:#fff;padding:9px 12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.cfg-tbl th:first-child{width:36px;text-align:center}
.cfg-tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.cfg-tbl tr:hover td{background:#f0fdf9}
.cfg-tbl tr.sel td{background:#e0f2f1}
.cfg-tbl tr:last-child td{border-bottom:none}
.cfg-tbl td:first-child{text-align:center}
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exp-card{border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;text-align:center;transition:all .15s}
.exp-card:hover{border-color:#00695c;background:#e8f5e9}
.exp-icon{font-size:28px;margin-bottom:6px}
.exp-card h4{font-size:12px;font-weight:600;margin-bottom:3px}
.exp-card p{font-size:11px;color:var(--muted)}

/* EXECUÇÃO DE GUIAS */
.exec-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.exec-date{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit}
.exec-dia-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.exec-dia-btn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:#fff;font-size:12px;cursor:pointer;font-weight:500;transition:all .15s;color:var(--muted)}
.exec-dia-btn:hover{border-color:#00a3e0;color:#00a3e0}
.exec-dia-btn.active{background:#00a3e0;color:#fff;border-color:#00a3e0;font-weight:600}
.exec-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:0;margin-bottom:8px;overflow:hidden;transition:all .15s}
.exec-card.exec-ok{border-color:#a5d6a7;background:#f1f8e9}
.exec-card.exec-falta{border-color:#ef9a9a;background:#fff8f8}
.exec-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.exec-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.exec-pacname{font-size:13px;font-weight:600;color:var(--text)}
.exec-meta{font-size:11px;color:var(--muted)}
.exec-status-pill{margin-left:auto;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.exec-body{border-top:1px solid var(--border);padding:10px 14px;display:none}
.exec-body.open{display:block}
.exec-esp-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f0f0}
.exec-esp-row:last-child{border-bottom:none}
.exec-esp-label{flex:1;font-size:12px;font-weight:500;color:var(--text)}
.exec-esp-prof{font-size:11px;color:var(--muted);min-width:120px}
.exec-esp-slot{font-size:11px;color:var(--muted);min-width:80px}
.exec-chk{width:20px;height:20px;cursor:pointer;accent-color:#2e7d32;flex-shrink:0}
.exec-obs-inp{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:11px;font-family:inherit;max-width:180px}
.exec-summary{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.exec-sum-card{text-align:center}
.exec-sum-num{font-size:22px;font-weight:700}
.exec-sum-lbl{font-size:11px;color:var(--muted)}
.exec-rel-section{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.exec-rel-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.exec-rel-table{width:100%;border-collapse:collapse;font-size:11px}
.exec-rel-table th{background:#1a1a2e;color:#fff;padding:7px 10px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.exec-rel-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.exec-rel-table tr:last-child td{border-bottom:none}
.exec-rel-table tr:hover td{background:#f9fafb}
.pill-ok{background:#d1fae5;color:#065f46;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.pill-falta{background:#fee2e2;color:#991b1b;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.pill-pend{background:#fef9c3;color:#713f12;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
</style>
</head>
<body>

<div id="ind"></div>
<div id="alerts"></div>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal-content"></div></div>

<div class="app">
  <div class="sidebar">
    <div class="logo-area" id="logo-area">
      <img src="/Logomarca_PsicoTEAM_1_.png" alt="PsicoTEAM"
        onerror="this.parentElement.innerHTML='<div class=logo-txt>PsicoTEAM</div>'">
    </div>
    <div class="sec-label">NAVEGAÇÃO</div>
    <button class="nav-btn active" id="nav-agenda" onclick="showPage('agenda')">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M5 1v4M11 1v4M1 7h14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Agenda
    </button>
    <button class="nav-btn" id="nav-pacientes" onclick="showPage('pacientes')">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="6" cy="5" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M1 14c0-3 2-5 5-5s5 2 5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Pacientes
    </button>
    <button class="nav-btn" id="nav-agendas" onclick="showPage('agendas')">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
      Gerenciar agendas
    </button>
    <button class="nav-btn" id="nav-execucao" onclick="showPage('execucao')">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 8l4 4 8-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Execução de Guias
    </button>
    <button class="nav-btn" id="nav-config" onclick="showPage('config')">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Configurações
    </button>
    <div class="sec-label" style="margin-top:8px">AGENDAS</div>
    <div id="sidebar-agendas"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <h2 id="page-title">Carregando...</h2>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTES
// ═══════════════════════════════════════════════════════════
const CONVS = ['Particular','Unimed','Unimed Intercâmbio']
const ESPS  = ['Psicologia','Fonoaudiologia','Psicopedagogia','Psicomotricidade','Terapia Ocupacional','Neuropsicologia','Outro']
const SLOTS_SEG_SEX = ['07h - 08h','08h - 09h','09h - 10h','10h - 11h','11h - 12h','12h - 13h','13h - 14h','14h - 15h','15h - 16h','16h - 17h','17h - 18h','18h - 19h']
const SLOTS_SAB     = ['07h - 08h','08h - 09h','09h - 10h','10h - 11h','11h - 12h']
const DIAS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado']

// ═══════════════════════════════════════════════════════════
// PERSISTÊNCIA — localStorage + servidor em paralelo
// ═══════════════════════════════════════════════════════════
const LS_KEY = 'psicoteam_v1'

function stateObj() {
  return { agendas, pacientes, currentAgendaId, nextPatId, nextAgendaId, execucoes }
}

function applyState(d) {
  if (!d) return
  if (Array.isArray(d.agendas)   && d.agendas.length)   agendas          = d.agendas
  if (Array.isArray(d.pacientes) && d.pacientes.length)  pacientes        = d.pacientes
  if (d.currentAgendaId != null) currentAgendaId = d.currentAgendaId
  if (d.nextPatId)    nextPatId    = d.nextPatId
  if (d.nextAgendaId) nextAgendaId = d.nextAgendaId
  if (d.execucoes && typeof d.execucoes === 'object') execucoes = d.execucoes
}

let _saveTimer = null
function saveData() {
  // 1. Salva imediatamente no localStorage
  try { localStorage.setItem(LS_KEY, JSON.stringify(stateObj())) } catch(e) {}
  showInd('💾 Salvando…','saving')
  // 2. Envia ao servidor com debounce
  clearTimeout(_saveTimer)
  _saveTimer = setTimeout(async () => {
    try {
      const r = await fetch('/api/data', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(stateObj())
      })
      if (r.ok) showInd('✅ Salvo','ok')
      else showInd('⚠️ Salvo local','saving')
    } catch(e) {
      showInd('⚠️ Salvo local (servidor offline)','saving')
    }
  }, 600)
}

async function loadData() {
  // 1. Tenta localStorage primeiro (instantâneo)
  try {
    const ls = localStorage.getItem(LS_KEY)
    if (ls) {
      applyState(JSON.parse(ls))
      showPage('agenda')
      checkAlertas()
      // Depois sincroniza com servidor em background
      syncServer()
      return
    }
  } catch(e) {}

  // 2. Tenta servidor
  try {
    const r = await fetch('/api/data')
    if (r.ok) {
      const j = await r.json()
      if (j.ok && j.data) { applyState(j.data); showPage('agenda'); checkAlertas(); return }
    }
  } catch(e) {}

  // 3. Fallback: seed embutido
  applyState(SEED)
  showPage('agenda')
  checkAlertas()
}

async function syncServer() {
  try {
    const r = await fetch('/api/data')
    if (!r.ok) return
    const j = await r.json()
    if (!j.ok || !j.data) return
    const d = j.data
    // Usa dados do servidor só se tiver mais agendas/pacientes que o local
    const srvAgendas   = Array.isArray(d.agendas)   ? d.agendas.length   : 0
    const srvPacientes = Array.isArray(d.pacientes)  ? d.pacientes.length : 0
    if (srvAgendas > agendas.length || srvPacientes > pacientes.length) {
      applyState(d)
      try { localStorage.setItem(LS_KEY, JSON.stringify(stateObj())) } catch(e) {}
      showPage(currentPage)
      checkAlertas()
    }
  } catch(e) {}
}

function dias(dateStr) {
  if (!dateStr) return null
  const hoje = new Date(); hoje.setHours(0,0,0,0)
  const d = new Date(dateStr + 'T12:00:00'); 
  return Math.round((d - hoje) / 86400000)
}

// ═══════════════════════════════════════════════════════════
// ALERTAS
// ═══════════════════════════════════════════════════════════
function checkAlertas() {
  const banner = document.getElementById('alerts')
  banner.innerHTML = ''
  const list = []
  const espLabels = {psicologia:'Psicologia',fono:'Fonoaudiologia',psicopedagogia:'Psicopedagogia',psicomotricidade:'Psicomotricidade',to:'T. Ocupacional'}

  pacientes.forEach(p => {
    // Guias por especialidade
    if (p.guias) {
      Object.entries(p.guias).forEach(([esp, g]) => {
        if (!g?.venc) return
        const d = dias(g.venc)
        if (d !== null && d <= 30) {
          const cls = d <= 7 ? 'urgente' : d <= 15 ? 'aviso' : 'ok-alert'
          const txt = d < 0 ? `VENCIDA há ${-d}d` : d === 0 ? 'VENCE HOJE' : `Vence em ${d}d`
          list.push({cls, msg:`📋 Guia ${espLabels[esp]||esp} — <strong>${p.nome}</strong>: ${txt}`})
        }
      })
    } else if (p.guiaVenc) {
      const d = dias(p.guiaVenc)
      if (d !== null && d <= 30) {
        const cls = d <= 7 ? 'urgente' : d <= 15 ? 'aviso' : 'ok-alert'
        const txt = d < 0 ? `VENCIDA há ${-d}d` : d === 0 ? 'VENCE HOJE' : `Vence em ${d}d`
        list.push({cls, msg:`📋 Guia — <strong>${p.nome}</strong>: ${txt}`})
      }
    }
    // Laudo
    if (p.laudoVenc) {
      const d = dias(p.laudoVenc)
      if (d !== null && d <= 30) {
        const cls = d <= 7 ? 'urgente' : d <= 15 ? 'aviso' : 'ok-alert'
        const txt = d < 0 ? `VENCIDO há ${-d}d` : d === 0 ? 'VENCE HOJE' : `Vence em ${d}d`
        list.push({cls, msg:`📄 Laudo — <strong>${p.nome}</strong>: ${txt}`})
      }
    }
  })

  list.slice(0,5).forEach(a => {
    const div = document.createElement('div')
    div.className = 'alert-item ' + a.cls
    div.innerHTML = a.msg + '<button class="alert-close" onclick="this.parentNode.remove()">✕</button>'
    banner.appendChild(div)
  })

  const navPac = document.getElementById('nav-pacientes')
  if (navPac) {
    navPac.querySelector('.badge')?.remove()
    if (list.length) navPac.innerHTML += `<span class="badge">${list.length}</span>`
  }
}

      </div>`).join('')}
    </div>`
  })
  document.getElementById('sidebar-agendas').innerHTML = html
}

function toggleGrp(esp) {
  const key = esp.replace(/\s/g,'_')
  const grp = document.getElementById('grp-'+key)
  const arr = document.getElementById('arr-'+key)
  const open = grp.style.maxHeight !== '0px' && grp.style.maxHeight !== '0'
  grp.style.maxHeight = open ? '0' : '600px'
  arr.textContent = open ? '▶' : '▼'
  collapsedGroups[esp] = !open
}

// AGENDA — RENDER
// ═══════════════════════════════════════════════════════════
function getAg() { return agendas.find(a => a.id === currentAgendaId) }

function getType(v) {
  if (!v) return 'vazio'
  if (v === 'bloqueado') return 'bloqueado'
  if (v.startsWith('almoco:')) return 'almoco'
  if (v.startsWith('reuniao:')) return 'reuniao'
  return 'paciente'
}

function parsePac(v) {
  const parts = v.split('|')
  let falta = false, obs = ''
  for (let i = 2; i < parts.length; i++) {
    if (parts[i] === 'falta') falta = true
    else if (parts[i].startsWith('obs:')) obs = parts[i].slice(4)
  }
  return { nome: parts[0]||'', conv: parts[1]||'Unimed', falta, obs }
}

function buildVal(nome, conv, falta, obs) {
  let v = nome + '|' + conv
  if (falta) v += '|falta'
  if (obs?.trim()) v += '|obs:' + obs.trim()
  return v
}

function pacClass(conv, falta) {
  if (falta) return 'pac-falta'
  if (conv === 'Unimed Intercâmbio') return 'pac-intercambio'
  if (conv === 'Particular') return 'pac-particular'
  return 'pac-unimed'
}

function renderAgenda() {
  const ag = getAg()
  if (!ag) return '<p style="color:var(--muted);padding:20px;font-size:13px">Selecione uma agenda no menu.</p>'

  let html = `<div class="legend">
    <span style="font-weight:600;font-size:11px">Legenda:</span>
    <div style="display:flex;align-items:center;gap:4px"><div class="leg-dot" style="background:#1b5e20"></div><span style="font-size:11px">Unimed</span></div>
    <div style="display:flex;align-items:center;gap:4px"><div class="leg-dot" style="background:#a5d6a7;border:1px solid #888"></div><span style="font-size:11px">Intercâmbio</span></div>
    <div style="display:flex;align-items:center;gap:4px"><div class="leg-dot" style="background:#1565c0"></div><span style="font-size:11px">Particular</span></div>
    <div style="display:flex;align-items:center;gap:4px"><div class="leg-dot" style="background:#c62828"></div><span style="font-size:11px">Falta</span></div>
    <div style="display:flex;align-items:center;gap:4px"><div class="leg-dot" style="background:#00bcd4"></div><span style="font-size:11px">Almoço</span></div>
    <div style="display:flex;align-items:center;gap:4px"><div class="leg-dot" style="background:#7b1fa2"></div><span style="font-size:11px">Reunião</span></div>
  </div>`

  if (ag.obs) html += `<div style="background:#fffde7;border:1px solid #f9a825;border-radius:6px;padding:8px 12px;font-size:12px;color:#5f3f00;margin-bottom:10px">📝 ${ag.obs}</div>`

  const activeSlots = ag.activeSlots || [...SLOTS_SEG_SEX]
  const allSlots = [...new Set([...SLOTS_SEG_SEX,...SLOTS_SAB])].filter(s => activeSlots.includes(s) || SLOTS_SAB.includes(s))

  html += '<div class="wrap"><table><thead><tr><th class="hora-col">Horário</th>' + DIAS.map(d=>`<th>${d}</th>`).join('') + '</tr></thead><tbody>'

  allSlots.forEach(slot => {
    if (SLOTS_SEG_SEX.includes(slot) && !activeSlots.includes(slot)) return
    html += `<tr><td class="hora-cell">${slot}</td>`
    for (let di = 0; di < 6; di++) {
      if (!SLOTS_SEG_SEX.includes(slot) && di < 5) { html += '<td class="bloqueado"></td>'; continue }
      const val = (ag.slots?.[slot]?.[di]) || ''
      const type = getType(val)
      if (type === 'bloqueado') html += '<td class="bloqueado"></td>'
      else if (type === 'almoco')  html += `<td class="almoco">${val.slice(7)||'ALMOÇO'}</td>`
      else if (type === 'reuniao') html += `<td class="reuniao">${val.slice(8)||'REUNIÃO'}</td>`
      else if (type === 'paciente') {
        const {nome,conv,falta,obs} = parsePac(val)
        const cls = pacClass(conv,falta)
        html += `<td class="${cls} paciente-cell" onclick="openCellModal('${slot.replace(/'/g,"\\'")}',${di})"><span>${nome}</span><span class="conv">${conv}</span></td>`
      } else {
        html += `<td class="vazio" onclick="openCellModal('${slot.replace(/'/g,"\\'")}',${di})"></td>`
      }
    }
    html += '</tr>'
  })
  html += '</tbody></table></div>'
  return html
}

        <select id="m-pat-sel" onchange="fillFromPat(this.value)"><option value="">— selecionar —</option>${patOpts}</select>
      </div>
      <div class="form-group"><label>Ou digitar nome</label><input type="text" id="m-name" value="${nome}" placeholder="Nome do paciente"></div>
      <div class="form-group"><label>Convênio</label><select id="m-conv">${convOpts}</select></div>
      <div class="form-group"><label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="m-falta" ${falta?'checked':''} style="width:auto"> Marcar como FALTA
      </label></div>
      <div class="form-group"><label>Observação</label><textarea id="m-obs">${obs}</textarea></div>
    </div>
    <div id="event-fields" style="display:none">
      <div class="form-group"><label>Descrição</label><input type="text" id="m-event" value="${evVal}" placeholder="Ex: ALMOÇO"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      ${val?'<button class="btn btn-red" onclick="clearCell()">Limpar</button>':''}
      <button class="btn btn-blue" onclick="saveCell()">Salvar</button>
    </div>`
  toggleCellType(document.getElementById('m-type').value)
  document.getElementById('modal-bg').classList.add('open')
}

function toggleCellType(v) {
  document.getElementById('pat-fields').style.display = v==='paciente' ? '' : 'none'
  document.getElementById('event-fields').style.display = v==='paciente' ? 'none' : ''
}
function fillFromPat(v) {
  if (!v) return
  const [nome, conv] = v.split('|')
  document.getElementById('m-name').value = nome
  const s = document.getElementById('m-conv')
  for (const o of s.options) if (o.value===conv) { o.selected=true; break }
}
function saveCell() {
  const ag=getAg(); if(!ag||!editingCell) return
  const {slot,di}=editingCell
  if (!ag.slots) ag.slots={}
  if (!ag.slots[slot]) ag.slots[slot]=['','','','','','bloqueado']
  const type=document.getElementById('m-type').value
  if (type==='vazio') ag.slots[slot][di]=''
  else if (type==='almoco') ag.slots[slot][di]='almoco:'+(document.getElementById('m-event').value||'ALMOÇO')
  else if (type==='reuniao') ag.slots[slot][di]='reuniao:'+(document.getElementById('m-event').value||'REUNIÃO')
  else {
    const n=document.getElementById('m-name').value.trim()
    if (!n) {alert('Digite o nome');return}
    ag.slots[slot][di]=buildVal(n,document.getElementById('m-conv').value,document.getElementById('m-falta').checked,document.getElementById('m-obs').value)
  }
  saveData();closeModal();showPage('agenda')
}
function clearCell() {
  const ag=getAg(); if(!ag||!editingCell) return
  ag.slots[editingCell.slot][editingCell.di]=''
  saveData();closeModal();showPage('agenda')
}

function saveNewCell() {

    ? `<div style="display:flex;align-items:center;gap:8px;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:6px;padding:8px 10px">
        <span>${lf.type?.startsWith('image/')?'🖼️':'📕'}</span>

            <input type="file" id="laudo-inp" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="handleLaudoFile(this.files[0])">

        </div>

function switchTab(tab,btn) {
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'))
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'))
  document.getElementById('tab-'+tab).classList.add('active')
  btn.classList.add('active')
}

function switchGTab(name,btn) {
  const bar=btn.closest('.gtab-bar')
  bar?.querySelectorAll('button').forEach(b=>b.classList.remove('gactive'))
  document.querySelectorAll('.gtab-pane').forEach(p=>p.classList.remove('active'))
  btn.classList.add('gactive')
  document.getElementById('gtab-'+name)?.classList.add('active')
}

function handleLaudoFile(file) {
  if (!file) return
  if (file.size > 5*1024*1024) { alert('Máximo 5MB'); return }
  const r = new FileReader()
  r.onload = e => {
    _laudoFile = {name:file.name,size:file.size,type:file.type,dataUrl:e.target.result}
    const prev=document.getElementById('laudo-prev')
    if (prev) prev.innerHTML=`<div style="display:flex;align-items:center;gap:8px;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:6px;padding:8px 10px">
      <span>${file.type.startsWith('image/')?'🖼️':'📕'}</span>
      <div style="flex:1;min-width:0;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${file.name}</div>
      <a href="${e.target.result}" target="_blank" style="font-size:11px;color:#00695c;font-weight:600;text-decoration:none">↗ Abrir</a>
      <button onclick="removeLaudo()" style="border:none;background:none;cursor:pointer;color:#c62828;font-size:16px">✕</button>
    </div>`
  }
  r.readAsDataURL(file)
}
function handleLaudoDrop(ev) {
  ev.preventDefault()
  handleLaudoFile(ev.dataTransfer.files[0])
}
function removeLaudo() {
  _laudoFile=null
  document.getElementById('laudo-inp').value=''
  document.getElementById('laudo-prev').innerHTML='<div style="font-size:11px;color:#999">Nenhum arquivo anexado</div>'
}

function savePat() {
  const nome=document.getElementById('p-nome').value.trim()
  if (!nome) {alert('Digite o nome do paciente');return}
  const espKeys=['psicologia','fono','psicopedagogia','psicomotricidade','to']
  const guias={}
  espKeys.forEach(k=>{
    guias[k]={
      num:       document.getElementById('g-'+k+'-num')?.value||'',
      venc:      document.getElementById('g-'+k+'-venc')?.value||'',
      sessoes:   document.getElementById('g-'+k+'-sessoes')?.value||'',
      realizadas:document.getElementById('g-'+k+'-realizadas')?.value||'',
      obs:       document.getElementById('g-'+k+'-obs')?.value||''
    }
  })
  const allVenc=espKeys.map(k=>guias[k].venc).filter(Boolean).sort()
  const existing=editingPatId?pacientes.find(x=>x.id===editingPatId):null
  const obj={
    id:           editingPatId||nextPatId++,
    nome,
    telefone:     document.getElementById('p-tel').value,
    nascimento:   document.getElementById('p-nasc').value,
    convenio:     document.getElementById('p-conv').value,
    obs:          document.getElementById('p-obs').value,
    guias,
    guiaVenc:     allVenc[0]||'',
    laudoVenc:    document.getElementById('p-laudo')?.value||'',
    laudoTipo:    document.getElementById('p-laudo-tipo')?.value||'',
    laudoObs:     document.getElementById('p-laudo-obs')?.value||'',
    laudoArquivo: _laudoFile||(existing?.laudoArquivo||null)
  }
  if (editingPatId) { const i=pacientes.findIndex(x=>x.id===editingPatId); pacientes[i]=obj }
  else pacientes.push(obj)
  saveData();closeModal();showPage('pacientes');checkAlertas()
}

function deletePat(id) {
  if (confirm('Remover este paciente?')) {
    pacientes=pacientes.filter(x=>x.id!==id)
    saveData();closeModal();showPage('pacientes')
  }
}

// ═══════════════════════════════════════════════════════════
// RENDER PACIENTES
// ═══════════════════════════════════════════════════════════
function renderPacientes(filter='') {
  const filtered=pacientes.filter(p=>(p.nome||'').toLowerCase().includes(filter.toLowerCase())||(p.convenio||'').toLowerCase().includes(filter.toLowerCase()))
  const colors=['#1565c0','#6a1b9a','#b71c1c','#00695c','#e65100','#4e342e']
  let html=`<input class="search-bar" placeholder="Buscar por nome ou convênio..." oninput="filterPats(this.value)" value="${filter}">`
  if (!filtered.length) return html+'<p style="color:var(--muted);font-size:13px">Nenhum paciente encontrado.</p>'
  filtered.forEach((p,i)=>{
    const ini=p.nome.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase()
    const col=colors[i%colors.length]
    const bg=p.convenio==='Particular'?'#e3f2fd':p.convenio==='Unimed Intercâmbio'?'#f1f8e9':'#e8f5e9'
    const tc=p.convenio==='Particular'?'#0d47a1':p.convenio==='Unimed Intercâmbio'?'#33691e':'#1b5e20'
    html+=`<div class="pat-card" onclick="openPatModal(${p.id})">
      <div class="av" style="background:${col}22;color:${col}">${ini}</div>
      <div class="pat-info"><h4>${p.nome}</h4><p>${p.telefone||''}${p.nascimento?' · '+p.nascimento.split('-').reverse().join('/'):''}</p></div>
      <span class="conv-badge" style="background:${bg};color:${tc}">${p.convenio||''}</span>
    </div>`
  })
  return html
}
function filterPats(v) { document.getElementById('content').innerHTML=renderPacientes(v) }

// MODAL AGENDA
// ═══════════════════════════════════════════════════════════
function openAgendaModal(id) {
  const ag=id?agendas.find(a=>a.id===id):null
  const activeSlots=ag?.activeSlots||[...SLOTS_SEG_SEX]
  const allSlots=[...new Set([...SLOTS_SEG_SEX,...SLOTS_SAB])]
  const slotRows=allSlots.map(s=>{
    const on=activeSlots.includes(s)
    const sid='st-'+s.replace(/[^a-z0-9]/gi,'_')
    return `<div class="slot-row">
      <span class="slot-label">${s}</span>
      <button type="button" class="slot-toggle ${on?'on':'off'}" id="${sid}" onclick="toggleSlot('${s}')">${on?'✓':'✗'}</button>
      <span id="${sid}-lbl" style="font-size:11px;color:var(--muted)">${on?'Ativo':'Bloqueado'}</span>
    </div>`
  }).join('')
  const swatches=CORES.map(c=>`<div class="swatch ${ag?.cor===c?'sel':''}" style="background:${c}" onclick="selCor('${c}')" id="sw-${c.slice(1)}" title="${c}"></div>`).join('')

  document.getElementById('modal-content').innerHTML=`
    <h3>${ag?'✏️ Editar agenda':'➕ Nova agenda'}</h3>
    <div class="form-group"><label>Nome do profissional *</label><input type="text" id="ag-nome" value="${ag?.nome||''}" placeholder="Nome"></div>
    <div class="form-group"><label>Especialidade</label>
      <select id="ag-esp">${ESPS.map(e=>`<option ${ag?.especialidade===e?'selected':''}>${e}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label>Observação</label><textarea id="ag-obs">${ag?.obs||''}</textarea></div>
    <div class="form-group"><label>Cor</label>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${swatches}</div>
      <input type="hidden" id="ag-cor" value="${ag?.cor||CORES[0]}">
    </div>
    <div class="form-group" style="margin-top:10px"><label>Horários ativos</label>
      <div class="slots-editor">${slotRows}</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      ${ag?`<button class="btn btn-red" onclick="deleteAgenda(${ag.id})">Remover</button>`:''}
      <button class="btn btn-blue" onclick="saveAgenda(${id||'null'})">Salvar</button>
    </div>`
  document.getElementById('modal-bg').classList.add('open')
}

function toggleSlot(s) {
  const sid='st-'+s.replace(/[^a-z0-9]/gi,'_')
  const btn=document.getElementById(sid)
  const lbl=document.getElementById(sid+'-lbl')
  const on=btn.classList.contains('on')
  btn.classList.toggle('on',!on); btn.classList.toggle('off',on)
  btn.textContent=on?'✗':'✓'
  lbl.textContent=on?'Bloqueado':'Ativo'
}

function selCor(c) {
  document.getElementById('ag-cor').value=c
  document.querySelectorAll('.swatch').forEach(el=>el.classList.toggle('sel',el.style.background===c||el.style.backgroundColor===c))
}

function saveAgenda(id) {
  const nome=document.getElementById('ag-nome').value.trim()
  if (!nome) {alert('Digite o nome');return}
  const cor=document.getElementById('ag-cor').value
  const obs=document.getElementById('ag-obs').value.trim()
  const especialidade=document.getElementById('ag-esp').value
  const allSlots=[...new Set([...SLOTS_SEG_SEX,...SLOTS_SAB])]
  const activeSlots=allSlots.filter(s=>{
    const btn=document.getElementById('st-'+s.replace(/[^a-z0-9]/gi,'_'))
    return btn?.classList.contains('on')
  })
  if (id) {
    const i=agendas.findIndex(a=>a.id===id)
    Object.assign(agendas[i],{nome,cor,obs,especialidade,activeSlots})
  } else {
    const slots={}
    SLOTS_SEG_SEX.forEach(sl=>{slots[sl]=['','','','','','bloqueado']})
    SLOTS_SAB.forEach(sl=>{if(!slots[sl])slots[sl]=['','','','','','bloqueado']})
    slots['12h - 13h']=['almoco:ALMOÇO','almoco:ALMOÇO','almoco:ALMOÇO','almoco:ALMOÇO','almoco:ALMOÇO','bloqueado']
    agendas.push({id:nextAgendaId++,nome,cor,obs,especialidade,activeSlots,slots})
  }
  saveData();closeModal();showPage('agendas')
}

function deleteAgenda(id) {
  if (agendas.length<=1) {alert('Mantenha ao menos uma agenda.');return}
  if (confirm('Remover esta agenda?')) {
    agendas=agendas.filter(a=>a.id!==id)
    if (currentAgendaId===id) currentAgendaId=agendas[0].id
    saveData();closeModal();showPage('agendas')
  }
}

function initCfg() {
  cfgSel=new Set(); cfgQ=''; cfgF=''
  renderCfgTable()
}

function switchCfgTab(name,btn) {
  document.querySelectorAll('.cfg-tab').forEach(b=>b.classList.remove('active'))
  document.querySelectorAll('.cfg-pane').forEach(p=>p.classList.remove('active'))
  btn.classList.add('active')
  document.getElementById('cfgp-'+name).classList.add('active')
}

function cfgGetList() {
  return pacientes.filter(p=>{
    const q=cfgQ.toLowerCase()
    return (!q||(p.nome||'').toLowerCase().includes(q))&&(!cfgF||p.convenio===cfgF)
  })
}

function renderCfgTable() {
  const list=cfgGetList()
  const tbody=document.getElementById('cfg-tbody')
  if (!tbody) return
  if (!list.length) {
    tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted)">Nenhum paciente encontrado</td></tr>'
  } else {
    tbody.innerHTML=list.map(p=>{
      const sel=cfgSel.has(p.id)
      const nasc=p.nascimento?p.nascimento.split('-').reverse().join('/'):'—'
      const vences=[]
      if(p.guias) Object.values(p.guias).forEach(g=>{if(g?.venc)vences.push(g.venc)})
      if(p.guiaVenc) vences.push(p.guiaVenc)
      let guiaTxt='—', guiaSt=''
      if(vences.length){
        const earliest=vences.sort()[0]
        const d=dias(earliest)
        guiaTxt=earliest.split('-').reverse().join('/')
        if(d!==null&&d<=30){
          guiaSt=d<=7?'color:#c62828;font-weight:600':d<=15?'color:#e65100;font-weight:600':''
          guiaTxt+= d<0?` ⚠️ vencida`:d===0?' ⚠️ HOJE':` ⚠️ ${d}d`
        }
      }
      const convBg=p.convenio==='Particular'?'#1565c0':p.convenio==='Unimed Intercâmbio'?'#6a1b9a':'#1b5e20'
      return `<tr class="${sel?'sel':''}" id="cr-${p.id}">
        <td><input type="checkbox" ${sel?'checked':''} onchange="cfgToggle(${p.id},this.checked)"></td>
        <td><strong>${p.nome}</strong></td>
        <td><span style="font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;background:${convBg};color:#fff">${p.convenio||'—'}</span></td>
        <td>${nasc}</td>
        <td style="${guiaSt}">${guiaTxt}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-outline btn-sm" style="margin-right:4px" onclick="openPatModal(${p.id})">✏</button>
          <button class="btn btn-red btn-sm" onclick="cfgDel(${p.id})">🗑</button>
        </td>
      </tr>`
    }).join('')
  }
  document.getElementById('cfg-info').textContent=list.length+' paciente'+(list.length!==1?'s':'')+' encontrado'+(list.length!==1?'s':'')
  cfgUpdateBulk()
}

function cfgToggle(id,checked){
  if(checked)cfgSel.add(id);else cfgSel.delete(id)
  document.getElementById('cr-'+id)?.classList.toggle('sel',checked)
  cfgUpdateBulk()
}
function cfgToggleAllChk(checked){cfgGetList().forEach(p=>{if(checked)cfgSel.add(p.id);else cfgSel.delete(p.id)});renderCfgTable()}
function cfgToggleAll(){const l=cfgGetList();if(cfgSel.size>=l.length)cfgSel.clear();else l.forEach(p=>cfgSel.add(p.id));renderCfgTable()}
function cfgClearSel(){cfgSel.clear();renderCfgTable()}
function cfgUpdateBulk(){
  const n=cfgSel.size
  document.getElementById('bulk-bar')?.classList.toggle('show',n>0)
  const btn=document.getElementById('btn-bulk');if(btn)btn.style.display=n>0?'inline-flex':'none'
  const sn=document.getElementById('sel-n');if(sn)sn.textContent=n
  const msg=document.getElementById('bulk-msg');if(msg)msg.textContent=n+' paciente'+(n!==1?'s':'')+' selecionado'+(n!==1?'s':'')
  const all=document.getElementById('chk-all')
  const total=cfgGetList().length
  if(all){all.indeterminate=n>0&&n<total;all.checked=n>0&&n>=total}
}
function cfgDel(id){
  if(confirm('Remover este paciente? Esta ação não pode ser desfeita.')){
    pacientes=pacientes.filter(x=>x.id!==id);cfgSel.delete(id)
    saveData();showPage('config')
  }
}
function cfgBulkDelete(){
  const ids=[...cfgSel],n=ids.length
  if(!n)return
  if(confirm('Remover '+n+' paciente'+(n!==1?'s':'')+'? Esta ação não pode ser desfeita.')){
    pacientes=pacientes.filter(p=>!ids.includes(p.id));cfgSel.clear()
    saveData();showPage('config')
  }
}

const DIAS_NOMES = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado']
const DIAS_IDX   = {Segunda:0,Terça:1,Quarta:2,Quinta:3,Sexta:4,Sábado:5}
const ESP_ICONS  = {Fonoaudiologia:'🗣',Psicologia:'🧠',Psicopedagogia:'📚',Psicomotricidade:'🤸','Terapia Ocupacional':'🖐',Neuropsicologia:'🔬',Outro:'📋'}

let execDia = 'Segunda'
let execData = new Date().toISOString().slice(0,10)

// Detecta dia da semana baseado na data selecionada
function diaDaSemana(dataStr) {
  if (!dataStr) return 'Segunda'
  const d = new Date(dataStr + 'T12:00:00')
  const idx = d.getDay() // 0=Dom,1=Seg,...,6=Sab
  const map = [null,'Segunda','Terça','Quarta','Quinta','Sexta','Sábado']
  return map[idx] || 'Segunda'
}

// Retorna todos os pacientes agendados em um dia da semana, com a especialidade do profissional
function getPacientesDoDia(diaNome) {
  const di = DIAS_IDX[diaNome]
  if (di === undefined) return []
  const result = []

  agendas.forEach(ag => {
    const esp = ag.especialidade || 'Outro'
    Object.entries(ag.slots || {}).forEach(([slot, dias]) => {
      const val = dias[di]
      if (!val || val === 'bloqueado' || val.startsWith('almoco:') || val.startsWith('reuniao:')) return
      const parts = val.split('|')
      const nome = (parts[0]||'').trim()
      const conv = parts[1]||'Unimed'
      const falta = parts.includes('falta')
      if (!nome || falta) return
      // Use safe unique key based on ag.id + slot (avoid special chars in names breaking HTML)
      const safeKey = ag.id + '_' + slot.replace(/[^0-9]/g,'') + '_' + di
      const key = nome+'|'+ag.id+'|'+slot
      if (!result.find(r => r._key === key)) {
        result.push({
          _key:        key,
          execKey:     safeKey,
          execLabel:   nome + ' | ' + esp,
          nome,
          convenio:    conv,
          horario:     slot,
          profissional: ag.nome,
          especialidade: esp,
          agendaId:    ag.id,
          agendaNome:  ag.nome,
          cor:         ag.cor || '#1b5e20'
        })
      }
    })
  })

  result.sort((a,b) => {
    const ha = parseInt(a.horario), hb = parseInt(b.horario)
    if (ha !== hb) return ha - hb
    return a.nome.localeCompare(b.nome)
  })
  return result
}

// Group by patient name
function agruparPorPaciente(items) {
  const map = {}
  items.forEach(item => {
    if (!map[item.nome]) map[item.nome] = { nome:item.nome, convenio:item.convenio, sessoes:[] }
    map[item.nome].sessoes.push(item)
  })
  return Object.values(map).sort((a,b) => a.nome.localeCompare(b.nome))
}

function getExecKey(data, execKey) { return (execucoes[data] || {})[execKey] || {feito:false,obs:''} }
function setExecKey(data, execKey, feito, obs) {
  if (!execucoes[data]) execucoes[data] = {}
  execucoes[data][execKey] = {feito, obs}
  saveData()
}

function renderExecucao() {
  const items = getPacientesDoDia(execDia)
  const grupos = agruparPorPaciente(items)

  // Summary counts
  let total=0, feitos=0, faltas=0

    total++
    const ex = getExecKey(execData, s.execKey)
    if (ex.feito) feitos++
  }))
  const pendentes = total - feitos

  // Progress bar %

  let html = `

    <div class="exec-sum-card">

      <div class="exec-sum-num" style="color:#6b7280">${pct}%</div>
      <div class="exec-sum-lbl">Concluído</div>
    </div>
  </div>
  <div style="background:#e9ecef;border-radius:10px;height:8px;margin-bottom:14px;overflow:hidden">
    <div class="exec-progress-bar" style="background:linear-gradient(90deg,#2e7d32,#66bb6a);height:100%;width:${pct}%;border-radius:10px;transition:width .4s"></div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <div style="font-size:12px;font-weight:600;color:var(--text)">${grupos.length} paciente${grupos.length!==1?'s':''} em ${execDia} (${execData.split('-').reverse().join('/')})</div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-green btn-sm" onclick="marcarTodos(true)">✅ Marcar todos</button>
      <button class="btn btn-outline btn-sm" onclick="marcarTodos(false)">↩ Desmarcar todos</button>
    </div>
  </div>`

  if (!grupos.length) {
    html += `<div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:32px;text-align:center;color:var(--muted);font-size:13px">
      Nenhum paciente agendado em ${execDia}
    </div>`
    return html
  }

  grupos.forEach(g => {
    const feitosTodos = g.sessoes.every(s => getExecKey(execData, s.execKey).feito)
    const algumFeito  = g.sessoes.some(s => getExecKey(execData, s.execKey).feito)
    const statusCls   = feitosTodos ? 'exec-ok' : ''
    const statusTxt   = feitosTodos ? '✅ Concluído' : algumFeito ? '⏳ Parcial' : '⏳ Pendente'
    const statusColor = feitosTodos ? 'background:#d1fae5;color:#065f46' : algumFeito ? 'background:#fef9c3;color:#713f12' : 'background:#f3f4f6;color:var(--muted)'
    const ini = g.nome.split(' ').slice(0,2).map(x=>x[0]||'').join('').toUpperCase()
    const convColor = g.convenio==='Particular'?'#1565c0':g.convenio==='Unimed Intercâmbio'?'#6a1b9a':'#1b5e20'
    const cardId = 'card-' + g.nome.replace(/[^a-z0-9]/gi,'_')

    html += `<div class="exec-card ${statusCls}" id="${cardId}">
      <div class="exec-header" onclick="toggleExecCard('${cardId}')">
        <div class="exec-avatar" style="background:${convColor}22;color:${convColor}">${ini}</div>
        <div>
          <div class="exec-pacname">${g.nome}</div>
          <div class="exec-meta">${g.convenio} · ${g.sessoes.length} especialidade${g.sessoes.length!==1?'s':''}</div>
        </div>
        <span class="exec-status-pill" style="${statusColor}">${statusTxt}</span>
        <span style="color:var(--muted);font-size:12px;margin-left:6px">▼</span>
      </div>
      <div class="exec-body" id="body-${cardId}">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--border)">
          <span style="flex:1;display:inline-block">Especialidade / Profissional</span>
          <span style="display:inline-block;width:80px;text-align:center">Horário</span>
          <span style="display:inline-block;width:80px;text-align:center">Executada?</span>
          <span style="display:inline-block;width:180px;text-align:left;padding-left:10px">Observação</span>
        </div>
        ${g.sessoes.map(s => {
          const ex = getExecKey(execData, s.execKey)
          const eid = 'ex-'+s.execKey
          return `<div class="exec-esp-row" id="row-${eid}">
            <div class="exec-esp-label">${ESP_ICONS[s.especialidade]||'📋'} ${s.especialidade}</div>
            <div class="exec-esp-prof" style="font-size:11px;color:var(--muted);min-width:130px">${s.profissional.replace(/.*- /,'')}</div>
            <div class="exec-esp-slot" style="font-size:11px;color:var(--muted);min-width:80px">${s.horario}</div>
            <input type="checkbox" class="exec-chk" id="chk-${eid}" ${ex.feito?'checked':''}
              data-ekey="${s.execKey}" data-date="${execData}"
              onchange="toggleExecEl(this)">
            <input type="text" class="exec-obs-inp" id="obs-${eid}" value="${ex.obs||''}" placeholder="Observação..."
              data-ekey="${s.execKey}" data-date="${execData}"
              onchange="saveObsEl(this)">
          </div>`
        }).join('')}
      </div>
    </div>`
  })

  return html
}

function execChangeData(val) {
  execData = val
  execDia  = diaDaSemana(val)
  document.getElementById('content').innerHTML = renderExecucao()
}

function execChangeDia(dia) {
  execDia = dia
  document.getElementById('content').innerHTML = renderExecucao()
}

function toggleExecCard(cardId) {
  const body = document.getElementById('body-'+cardId)
  body.classList.toggle('open')
}

function toggleExecEl(chkEl) {
  const execKey = chkEl.dataset.ekey
  const data    = chkEl.dataset.date
  const eid     = 'ex-'+execKey
  const obs     = document.getElementById('obs-'+eid)?.value || ''
  setExecKey(data, execKey, chkEl.checked, obs)
  updateCardStatus(chkEl.closest('.exec-card'))
  updateExecSummary()
}

function saveObsEl(inp) {
  const execKey = inp.dataset.ekey
  const data    = inp.dataset.date
  const eid     = 'ex-'+execKey
  const chk     = document.getElementById('chk-'+eid)
  setExecKey(data, execKey, chk?.checked||false, inp.value)
}

function updateCardStatus(card) {
  if (!card) return
  const chks = card.querySelectorAll('.exec-chk')
  const allDone = [...chks].every(c=>c.checked)
  const anyDone = [...chks].some(c=>c.checked)
  card.className = 'exec-card ' + (allDone?'exec-ok':'')
  const pill = card.querySelector('.exec-status-pill')
  if (pill) {
    pill.textContent = allDone?'✅ Concluído':anyDone?'⏳ Parcial':'⏳ Pendente'
    pill.style.cssText = allDone?'background:#d1fae5;color:#065f46':anyDone?'background:#fef9c3;color:#713f12':'background:#f3f4f6;color:var(--muted);margin-left:auto'
  }
}

function updateExecSummary() {
  const items = getPacientesDoDia(execDia)
  let total=0, feitos=0
  items.forEach(s => { total++; if(getExecKey(execData,s.execKey).feito) feitos++ })
  const pct = total ? Math.round(feitos/total*100) : 0
  const bar = document.querySelector('.exec-progress-bar')
  if(bar) bar.style.width = pct+'%'
  const nums = document.querySelectorAll('.exec-sum-num')
  if(nums.length>=4){ nums[1].textContent=feitos; nums[2].textContent=total-feitos; nums[3].textContent=pct+'%' }
}

function saveObs(data, execKey, eid, obs) {
  const chk = document.getElementById('chk-'+eid)
  setExecKey(data, execKey, chk?.checked||false, obs)
}

function marcarTodos(feito) {
  const items = getPacientesDoDia(execDia)
  items.forEach(s => {
    const old = getExecKey(execData, s.execKey)
    setExecKey(execData, s.execKey, feito, old.obs)
  })
  document.getElementById('content').innerHTML = renderExecucao()
  document.querySelectorAll('.exec-body').forEach(b=>b.classList.add('open'))
}

// ─── RELATÓRIO EXECUÇÃO ───────────────────────────────────────────────────────
function gerarRelatorio(dataStr) {
  const items = getPacientesDoDia(diaDaSemana(dataStr))
  const grupos = agruparPorPaciente(items)
  let feitos=0, pendentes=0, total=0

  let rows = ''
  grupos.forEach(g => {
    g.sessoes.forEach(s => {
      total++
      const ex = getExecKey(dataStr, s.execKey)
      const ok = ex.feito
      if(ok) feitos++; else pendentes++
      rows += `<tr>
        <td>${g.nome}</td>
        <td>${g.convenio}</td>
        <td>${ESP_ICONS[s.especialidade]||''} ${s.especialidade}</td>
        <td>${s.profissional.split(' - ')[0]}</td>
        <td>${s.horario}</td>
        <td><span class="${ok?'pill-ok':'pill-pend'}">${ok?'✅ Executada':'⏳ Pendente'}</span></td>
        <td>${ex.obs||'—'}</td>
      </tr>`
    })
  })

  return {feitos, pendentes, total, rows, grupos}
}

  const w = window.open('','_blank')

  <style>

  </style></head><body>

  <div class="sub">${execDia}, ${execData.split('-').reverse().join('/')} · Gerado em ${new Date().toLocaleString('pt-BR')}</div>
  <div class="stats">

    <div class="stat"><b style="color:#c45c00">${pendentes}</b>Pendentes</div>
    <div class="stat"><b style="color:#555">${total?Math.round(feitos/total*100):0}%</b>Concluído</div>
  </div>
  <table>
    <thead><tr><th>Paciente</th><th>Convênio</th><th>Especialidade</th><th>Profissional</th><th>Horário</th><th>Status</th><th>Observação</th></tr></thead>

}

function expExecucaoCSV() {
  const {grupos} = gerarRelatorio(execData)
  const rows = [['Data','Dia','Paciente','Convênio','Especialidade','Profissional','Horário','Executada','Observação']]
  getPacientesDoDia(execDia).forEach(s => {
    const ex = getExecKey(execData, s.execKey)
    rows.push([execData, execDia, s.nome, s.convenio, s.especialidade, s.profissional, s.horario, ex.feito?'Sim':'Não', ex.obs||''])
  })
  const csv = rows.map(r=>r.map(v=>'"'+(v||'').replace(/"/g,'""')+'"').join(',')).join('\n')
  dlBlob(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}), 'execucao_'+execData+'.csv')
}
