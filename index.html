// EXECUÇÃO DE GUIAS
// ═══════════════════════════════════════════════════════════
const DIAS_NOMES = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado']
const DIAS_IDX   = {Segunda:0,Terça:1,Quarta:2,Quinta:3,Sexta:4,Sábado:5}
const ESP_ICONS  = {Fonoaudiologia:'🗣',Psicologia:'🧠',Psicopedagogia:'📚',Psicomotricidade:'🤸','Terapia Ocupacional':'🖐',Neuropsicologia:'🔬',Outro:'📋'}

let execDia = 'Segunda'
let execData = new Date().toISOString().slice(0,10)

// Detecta dia da semana baseado na data selecionada
function diaDaSemana(dataStr) {
  if (!dataStr) return 'Segunda'
  const d = new Date(dataStr + 'T12:00:00')
  const idx = d.getDay() // 0=Dom,1=Seg,...,6=Sab
  const map = [null,'Segunda','Terça','Quarta','Quinta','Sexta','Sábado']
  return map[idx] || 'Segunda'
}

// Retorna todos os pacientes agendados em um dia da semana, com a especialidade do profissional
function getPacientesDoDia(diaNome) {
  const di = DIAS_IDX[diaNome]
  if (di === undefined) return []
  const result = []

  agendas.forEach(ag => {
    const esp = ag.especialidade || 'Outro'
    Object.entries(ag.slots || {}).forEach(([slot, dias]) => {
      const val = dias[di]
      if (!val || val === 'bloqueado' || val.startsWith('almoco:') || val.startsWith('reuniao:') || val.startsWith('profFalta:')) return
      const parts = val.split('|')
      const nome = (parts[0]||'').trim()
      const conv = parts[1]||'Unimed'
      const falta = parts.includes('falta')
      if (!nome || falta) return
      // Use safe unique key based on ag.id + slot (avoid special chars in names breaking HTML)
      const safeKey = ag.id + '_' + slot.replace(/[^0-9]/g,'') + '_' + di
      const key = nome+'|'+ag.id+'|'+slot
      if (!result.find(r => r._key === key)) {
        result.push({
          _key:        key,
          execKey:     safeKey,
          execLabel:   nome + ' | ' + esp,
          nome,
          convenio:    conv,
          horario:     slot,
          profissional: ag.nome,
          especialidade: esp,
          agendaId:    ag.id,
          agendaNome:  ag.nome,
          cor:         ag.cor || '#1b5e20'
        })
      }
    })
  })

  result.sort((a,b) => {
    const ha = parseInt(a.horario), hb = parseInt(b.horario)
    if (ha !== hb) return ha - hb
    return a.nome.localeCompare(b.nome)
  })
  return result
}

// Group by patient name
function agruparPorPaciente(items) {
  const map = {}
  items.forEach(item => {
    if (!map[item.nome]) map[item.nome] = { nome:item.nome, convenio:item.convenio, sessoes:[] }
    map[item.nome].sessoes.push(item)
  })
  return Object.values(map).sort((a,b) => a.nome.localeCompare(b.nome))
}

function getExecKey(data, execKey) { return (execucoes[data] || {})[execKey] || {feito:false,obs:''} }
function setExecKey(data, execKey, feito, obs) {
  if (!execucoes[data]) execucoes[data] = {}
  execucoes[data][execKey] = {feito, obs}
  saveData()
}

function renderExecucao() {
  const items = getPacientesDoDia(execDia)
  const grupos = agruparPorPaciente(items)

  // Summary counts
  let total=0, feitos=0, faltas=0
  grupos.forEach(g => g.sessoes.forEach(s => {
    total++
    const ex = getExecKey(execData, s.execKey)
    if (ex.feito) feitos++
  }))
  const pendentes = total - feitos

  // Progress bar %
  const pct = total ? Math.round(feitos/total*100) : 0

  let html = `
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
    <div>
      <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:3px">📅 Data</label>
      <input type="date" class="exec-date" id="exec-date-inp" value="${execData}" onchange="execChangeData(this.value)">
    </div>
    <div style="flex:1">
      <div class="exec-dia-tabs">
        ${DIAS_NOMES.map(d=>`<button class="exec-dia-btn${d===execDia?' active':''}" onclick="execChangeDia('${d}')">${d}</button>`).join('')}
      </div>
    </div>
  </div>

  <div class="exec-summary">
    <div class="exec-sum-card">
      <div class="exec-sum-num" style="color:#00a3e0">${total}</div>
      <div class="exec-sum-lbl">Sessões programadas</div>
    </div>
    <div class="exec-sum-card">
      <div class="exec-sum-num" style="color:#2e7d32">${feitos}</div>
      <div class="exec-sum-lbl">Executadas ✅</div>
    </div>
    <div class="exec-sum-card">
      <div class="exec-sum-num" style="color:#e65100">${pendentes}</div>
      <div class="exec-sum-lbl">Pendentes ⏳</div>
    </div>
    <div class="exec-sum-card">
      <div class="exec-sum-num" style="color:#6b7280">${pct}%</div>
      <div class="exec-sum-lbl">Concluído</div>
    </div>
  </div>
  <div style="background:#e9ecef;border-radius:10px;height:8px;margin-bottom:14px;overflow:hidden">
    <div class="exec-progress-bar" style="background:linear-gradient(90deg,#2e7d32,#66bb6a);height:100%;width:${pct}%;border-radius:10px;transition:width .4s"></div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
    <div style="font-size:12px;font-weight:600;color:var(--text)">${grupos.length} paciente${grupos.length!==1?'s':''} em ${execDia} (${execData.split('-').reverse().join('/')})</div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-green btn-sm" onclick="marcarTodos(true)">✅ Marcar todos</button>
      <button class="btn btn-outline btn-sm" onclick="marcarTodos(false)">↩ Desmarcar todos</button>
    </div>
  </div>`

  if (!grupos.length) {
    html += `<div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:32px;text-align:center;color:var(--muted);font-size:13px">
      Nenhum paciente agendado em ${execDia}
    </div>`
    return html
  }

  grupos.forEach(g => {
    const feitosTodos = g.sessoes.every(s => getExecKey(execData, s.execKey).feito)
    const algumFeito  = g.sessoes.some(s => getExecKey(execData, s.execKey).feito)
    const statusCls   = feitosTodos ? 'exec-ok' : ''
    const statusTxt   = feitosTodos ? '✅ Concluído' : algumFeito ? '⏳ Parcial' : '⏳ Pendente'
    const statusColor = feitosTodos ? 'background:#d1fae5;color:#065f46' : algumFeito ? 'background:#fef9c3;color:#713f12' : 'background:#f3f4f6;color:var(--muted)'
    const ini = g.nome.split(' ').slice(0,2).map(x=>x[0]||'').join('').toUpperCase()
    const convColor = g.convenio==='Particular'?'#1565c0':g.convenio==='Unimed Intercâmbio'?'#6a1b9a':'#1b5e20'
    const cardId = 'card-' + g.nome.replace(/[^a-z0-9]/gi,'_')

    html += `<div class="exec-card ${statusCls}" id="${cardId}">
      <div class="exec-header" onclick="toggleExecCard('${cardId}')">
        <div class="exec-avatar" style="background:${convColor}22;color:${convColor}">${ini}</div>
        <div>
          <div class="exec-pacname">${g.nome}</div>
          <div class="exec-meta">${g.convenio} · ${g.sessoes.length} especialidade${g.sessoes.length!==1?'s':''}</div>
        </div>
        <span class="exec-status-pill" style="${statusColor}">${statusTxt}</span>
        <span style="color:var(--muted);font-size:12px;margin-left:6px">▼</span>
      </div>
      <div class="exec-body" id="body-${cardId}">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--border)">
          <span style="flex:1;display:inline-block">Especialidade / Profissional</span>
          <span style="display:inline-block;width:80px;text-align:center">Horário</span>
          <span style="display:inline-block;width:80px;text-align:center">Executada?</span>
          <span style="display:inline-block;width:180px;text-align:left;padding-left:10px">Observação</span>
        </div>
        ${g.sessoes.map(s => {
          const ex = getExecKey(execData, s.execKey)
          const eid = 'ex-'+s.execKey
          return `<div class="exec-esp-row" id="row-${eid}">
            <div class="exec-esp-label">${ESP_ICONS[s.especialidade]||'📋'} ${s.especialidade}</div>
            <div class="exec-esp-prof" style="font-size:11px;color:var(--muted);min-width:130px">${s.profissional.replace(/.*- /,'')}</div>
            <div class="exec-esp-slot" style="font-size:11px;color:var(--muted);min-width:80px">${s.horario}</div>
            <input type="checkbox" class="exec-chk" id="chk-${eid}" ${ex.feito?'checked':''}
              data-ekey="${s.execKey}" data-date="${execData}"
              onchange="toggleExecEl(this)">
            <input type="text" class="exec-obs-inp" id="obs-${eid}" value="${ex.obs||''}" placeholder="Observação..."
              data-ekey="${s.execKey}" data-date="${execData}"
              onchange="saveObsEl(this)">
          </div>`
        }).join('')}
      </div>
    </div>`
  })

  return html
}

function execChangeData(val) {
  execData = val
  execDia  = diaDaSemana(val)
  document.getElementById('content').innerHTML = renderExecucao()
}

function execChangeDia(dia) {
  execDia = dia
  document.getElementById('content').innerHTML = renderExecucao()
}

function toggleExecCard(cardId) {
  const body = document.getElementById('body-'+cardId)
  body.classList.toggle('open')
}

function toggleExecEl(chkEl) {
  const execKey = chkEl.dataset.ekey
  const data    = chkEl.dataset.date
  const eid     = 'ex-'+execKey
  const obs     = document.getElementById('obs-'+eid)?.value || ''
  setExecKey(data, execKey, chkEl.checked, obs)
  updateCardStatus(chkEl.closest('.exec-card'))
  updateExecSummary()
}

function saveObsEl(inp) {
  const execKey = inp.dataset.ekey
  const data    = inp.dataset.date
  const eid     = 'ex-'+execKey
  const chk     = document.getElementById('chk-'+eid)
  setExecKey(data, execKey, chk?.checked||false, inp.value)
}

function updateCardStatus(card) {
  if (!card) return
  const chks = card.querySelectorAll('.exec-chk')
  const allDone = [...chks].every(c=>c.checked)
  const anyDone = [...chks].some(c=>c.checked)
  card.className = 'exec-card ' + (allDone?'exec-ok':'')
  const pill = card.querySelector('.exec-status-pill')
  if (pill) {
    pill.textContent = allDone?'✅ Concluído':anyDone?'⏳ Parcial':'⏳ Pendente'
    pill.style.cssText = allDone?'background:#d1fae5;color:#065f46':anyDone?'background:#fef9c3;color:#713f12':'background:#f3f4f6;color:var(--muted);margin-left:auto'
  }
}

function updateExecSummary() {
  const items = getPacientesDoDia(execDia)
  let total=0, feitos=0
  items.forEach(s => { total++; if(getExecKey(execData,s.execKey).feito) feitos++ })
  const pct = total ? Math.round(feitos/total*100) : 0
  const bar = document.querySelector('.exec-progress-bar')
  if(bar) bar.style.width = pct+'%'
  const nums = document.querySelectorAll('.exec-sum-num')
  if(nums.length>=4){ nums[1].textContent=feitos; nums[2].textContent=total-feitos; nums[3].textContent=pct+'%' }
}

function saveObs(data, execKey, eid, obs) {
  const chk = document.getElementById('chk-'+eid)
  setExecKey(data, execKey, chk?.checked||false, obs)
}

function marcarTodos(feito) {
  const items = getPacientesDoDia(execDia)
  items.forEach(s => {
    const old = getExecKey(execData, s.execKey)
    setExecKey(execData, s.execKey, feito, old.obs)
  })
  document.getElementById('content').innerHTML = renderExecucao()
  document.querySelectorAll('.exec-body').forEach(b=>b.classList.add('open'))
}

// ─── RELATÓRIO EXECUÇÃO ───────────────────────────────────────────────────────
function getFaltasProfissional(dataStr) {
  var result = []
  agendas.forEach(function(ag) {
    // New system: check ag.faltas array
    if (ag.faltas) {
      var falta = ag.faltas.find(function(f){ return f.data===dataStr })
      if (falta) {
        // Count how many patients are affected (all slots of that day)
        var di = DIAS_IDX[diaDaSemana(dataStr)]
        var pacientes_afetados = []
        Object.values(ag.slots||{}).forEach(function(dias){
          var val = di !== undefined ? dias[di] : ''
          if (val && val !== 'bloqueado' && !val.startsWith('almoco:') && !val.startsWith('reuniao:')) {
            var p = parsePac(val.startsWith('suporte:')?val.slice(8):val)
            if (p.nome) pacientes_afetados.push(p.nome)
          }
        })
        result.push({
          profissional: ag.nome,
          especialidade: ag.especialidade||'',
          horario: 'Dia todo',
          motivo: falta.motivo||'Falta',
          paciente: pacientes_afetados.join(', ')||'—'
        })
      }
    }
    // Legacy: also check profFalta: in slots
    var di2 = DIAS_IDX[diaDaSemana(dataStr)]
    Object.entries(ag.slots||{}).forEach(function(entry) {
      var slot=entry[0], dias=entry[1]
      var val = di2 !== undefined ? dias[di2] : ''
      if (val && val.startsWith('profFalta:')) {
        var pfPts = val.split(';;')
        var mot = pfPts[0].slice(10)||'Falta'
        var pfPacVal = pfPts.slice(1).join(';;')
        var pfPacNome = pfPacVal ? parsePac(pfPacVal).nome : '—'
        result.push({profissional:ag.nome, especialidade:ag.especialidade||'', horario:slot, motivo:mot, paciente:pfPacNome})
      }
    })
  })
  return result
}

function gerarRelatorio(dataStr) {
  const items = getPacientesDoDia(diaDaSemana(dataStr))
  const grupos = agruparPorPaciente(items)
  let feitos=0, pendentes=0, total=0

  let rows = ''
  grupos.forEach(g => {
    g.sessoes.forEach(s => {
      total++
      const ex = getExecKey(dataStr, s.execKey)
      const ok = ex.feito
      if(ok) feitos++; else pendentes++
      rows += `<tr>
        <td>${g.nome}</td>
        <td>${g.convenio}</td>
        <td>${ESP_ICONS[s.especialidade]||''} ${s.especialidade}</td>
        <td>${s.profissional.split(' - ')[0]}</td>
        <td>${s.horario}</td>
        <td><span class="${ok?'pill-ok':'pill-pend'}">${ok?'✅ Executada':'⏳ Pendente'}</span></td>
        <td>${ex.obs||'—'}</td>
      </tr>`
    })
  })

  return {feitos, pendentes, total, rows, grupos}
}

function imprimirAgendaPaciente(nomePac) {
  // Busca todas as sessões do paciente em todas as agendas
  const sessoes = []  // {dia, horario, especialidade, profissional, cor}

  agendas.forEach(ag => {

      dias.forEach((val, di) => {
        if (!val || val === 'bloqueado' || val.startsWith('almoco:') || val.startsWith('reuniao:') || val.startsWith('profFalta:')) return
        const parts = val.split('|')
        const nome = (parts[0]||'').trim()
        if (nome.toLowerCase() === nomePac.toLowerCase()) {
          sessoes.push({
            dia: di,
            diaNome: DIAS[di],
            horario: slot,
            especialidade: ag.especialidade || 'Outro',
            profissional: ag.nome,
            convenio: parts[1]||'Unimed'
          })
        }
      })
    })
  })

  if (!sessoes.length) { alert('Paciente não encontrado nas agendas'); return }

// ─── FALTAS DE PROFISSIONAL POR DATA ─────────────────────────────────────────
function addFaltaProf(agId) {
  const ag = agendas.find(function(a){ return a.id===agId })
  if (!ag) { alert('Agenda não encontrada: ' + agId); return }
  const dataEl   = document.getElementById('ag-falta-data')
  const motivoEl = document.getElementById('ag-falta-motivo')
  if (!dataEl) { alert('Campo de data não encontrado'); return }
  const data   = dataEl.value
  const motivo = motivoEl ? motivoEl.value.trim() : ''
  if (!data) { alert('Selecione a data da falta'); return }
  if (!ag.faltas) ag.faltas = []
  if (ag.faltas.find(function(f){ return f.data===data })) {
    if (!confirm('Já existe uma falta nessa data. Deseja substituir?')) return
    ag.faltas = ag.faltas.filter(function(f){ return f.data!==data })
  }
  ag.faltas.push({ data: data, motivo: motivo||'Falta' })
  ag.faltas.sort(function(a,b){ return a.data.localeCompare(b.data) })
  saveData()
  // Refresh list without closing modal
  const list = document.getElementById('falta-list-'+agId)
  if (list) {
    list.innerHTML = ag.faltas.map(function(f,i){
      return '<div class="falta-item">' +
        '<span class="fi-date">' + f.data.split('-').reverse().join('/') + '</span>' +
        '<span class="fi-mot">' + (f.motivo||'—') + '</span>' +
        '<button class="fi-del" onclick="removeFaltaProf(' + agId + ',' + i + ')" title="Remover">✕</button>' +
        '</div>'
    }).join('')
  }
  // Update tab counter
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    if (btn.textContent.includes('Faltas')) btn.textContent = '🚫 Faltas (' + ag.faltas.length + ')'
  })
  if (dataEl) dataEl.value = ''
  if (motivoEl) motivoEl.value = ''
  showInd('✅ Falta registrada para ' + data.split('-').reverse().join('/'), 'ok')
  if (currentAgendaId === agId) showPage('agenda')
}

function removeFaltaProf(agId, idx) {
  const ag = agendas.find(function(a){ return a.id===agId })
  if (!ag || !ag.faltas) return
  const f = ag.faltas[idx]
  if (!f) return
  if (!confirm('Remover falta de ' + f.data.split('-').reverse().join('/') + '?')) return
  ag.faltas.splice(idx, 1)
  saveData()
  openAgendaModal(agId)
  if (currentAgendaId === agId) showPage('agenda')
}

function profFaltouNaData(agId, dataStr) {
  const ag = agendas.find(function(a){ return a.id===agId })
  if (!ag || !ag.faltas) return null
  return ag.faltas.find(function(f){ return f.data===dataStr }) || null
}

function todayStr() {
  return new Date().toISOString().slice(0,10)
}
